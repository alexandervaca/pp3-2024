{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TUM GURÚ - Cotización</title>
	 <!-- Favicon-->
	 <link rel="icon" type="image/x-icon" href="{% static 'imagenes/guru-big.png' %}"/>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="{% static 'css/all.css.' %}">
	<!-- Google Fonts -->
	<link rel="stylesheet" href="{% static 'css/css2.css.' %}">
	<!-- Bootstrap CSS -->
	<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="{% static 'css/style.css' %}">

	<style>
		.cotizacion-container {
			background-color: #f7f7f7;
			padding: 50px 20px;
			border-radius: 10px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
			max-width: 1000px;
			margin: auto;
			text-align: center;
		}

		.final-title {
			font-size: 28px;
			font-weight: bold;
			color: #7f4399;
			margin-bottom: 30px;
		}

		.proveedores-text {
			font-size: 20px;
			color: #555;
			margin-bottom: 20px;
		}

		.proveedor-box {
			display: inline-block;
			width: 22%;
			margin: 10px;
			padding: 20px;
			background-color: #ffffff;
			border-radius: 10px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			text-align: center;
			transition: all 0.3s ease;
		}

		.proveedor-box:hover {
			transform: translateY(-5px);
		}

		.proveedor-logo {
			width: 80px;
			height: 80px;
			margin-bottom: 15px;
		}

		.proveedor-price {
			font-size: 24px;
			font-weight: bold;
			color: #fa560a;
			margin-bottom: 10px;
		}

		.btn-contacto {
			background-color: #fa560a;
			color: white;
			padding: 10px 20px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			margin-bottom: 20px;
		}

		.btn-contacto.selected {
			background-color: #2ecc71;
		}

		.contactar-boton {
			display: block;
			padding: 10px 20px;
			border: none;
			border-radius: 5px;
			margin-top: 20px;
			cursor: pointer;
			transition: background-color 0.3s ease;
		}

		.contactar-boton.no-contact {
			background-color: #fa560a;
			color: white;
		}

		.contactar-boton.contact {
			background-color: #2ecc71;
			color: white;
		}

		.contactar-boton:hover {
			opacity: 0.9;
		}

		.footer-notes {
			font-size: 14px;
			color: #888;
			margin-top: 20px;
			text-align: left;
		}

		.footer-notes span {
			display: block;
		}
	</style>
    {% block head %}

    {% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}


	<!-- Bootstrap JS and custom scripts -->
	<script src="{% static 'js/jquery.min.js'%}"></script>
	<script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
	<script src="{% static 'js/script.js'%}"></script>

	<script>
		// Array para almacenar los proveedores seleccionados
		let selectedProviders = [];

		// Seleccionar proveedores al hacer clic en los botones
		document.querySelectorAll('.btn-contacto').forEach(function (btn) {
			btn.addEventListener('click', function () {
				const providerId = this.getAttribute('data-id');
				if (!selectedProviders.includes(providerId)) {
					selectedProviders.push(providerId);
					this.classList.add('selected');
				} else {
					selectedProviders = selectedProviders.filter(id => id !== providerId);
					this.classList.remove('selected');
				}
				updateContactButton();
			});
		});

		// Actualizar el botón final dinámicamente
		function updateContactButton() {
			const contactButton = document.getElementById('finalContact');
			if (selectedProviders.length > 0) {
				contactButton.textContent = 'Quiero que me contacten';
				contactButton.classList.remove('no-contact');
				contactButton.classList.add('contact');
			} else {
				contactButton.textContent = 'No Quiero que me contacten';
				contactButton.classList.remove('contact');
				contactButton.classList.add('no-contact');
			}
		}

		// Acción al hacer clic en "Quiero que me contacten"
		document.getElementById('finalContact').addEventListener('click', function() {
			if (confirm('¿Estás seguro que deseas ser contactado por por las marcas seleccionadas?')) {
				window.location.href = '../fin'; // Redirige a la página final
			}
		});
		
	</script>

	
</body>

</html>
