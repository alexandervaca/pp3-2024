{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TUM GURÚ - Cotización</title>
	 <!-- Favicon-->
	<link rel="icon" type="image/x-icon" href="{% static 'imagenes/guru-big.png' %}"/>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="{% static 'css/all.css.' %}">
	<!-- Google Fonts -->
	<link rel="stylesheet" href="{% static 'css/css2.css.' %}">
	<!-- Bootstrap CSS -->
	<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
	<!-- Custom CSS -->
	<link rel="stylesheet" href="{% static 'css/style.css' %}">

	<style>
		body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .proveedor-logo {
			width: 80px;
			height: 80px;
			margin-bottom: 15px;
		}
        /*
        .cotizacion-container {
            max-width: 800px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
         */
        .cotizacion-container {
			background-color: #f7f7f7;
			padding: 50px 20px;
			border-radius: 10px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
			max-width: 1000px;
			margin: auto;
			text-align: center;
		}  
          
        .final-title {
            font-size: 26px;
            color: #7f4399;
            margin-bottom: 10px;
        }
        .proveedores-text {
            font-size: 16px;
            color: #555;
            margin: 15px 0;
            text-align: left;
        }
        .section-title {
            list-style-type: none;
            padding: 0;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .section-title li {
            margin-bottom: 8px;
            background-color: #f0f0f5;
            padding: 8px;
            border-radius: 5px;
        }
        /* 
        .proveedor-box {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: inline-block;
            text-align: left;
        }
        */
        .proveedor-box {
			display: inline-block;
			width: 22%;
			margin: 10px;
			padding: 20px;
			background-color: #ffffff;
			border-radius: 10px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			text-align: center;
			transition: all 0.3s ease;
		}
        
        .proveedor-price {
            font-size: 18px;
            font-weight: bold;
            color: #fa560a;
        }
        .footer-notes {
            font-size: 12px;
            color: #8B0000;
            margin-top: 20px;
            text-align: left;
        }
        .footer-notes span {
            display: block;
            margin-top: 5px;
        }
	</style>
    {% block head %}

    {% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}


	<!-- Bootstrap JS and custom scripts -->
	<script src="{% static 'js/jquery.min.js'%}"></script>
	<script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
	<script src="{% static 'js/script.js'%}"></script>
	<script src="{% static 'js/paso-final-botones.js'%}"></script>

</body>
</html>
