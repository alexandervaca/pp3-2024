{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Editar Mi Perfil</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" class="form-control" id="username" name="username" value="{{ formulario.instance.username }}" required>
        </div>
        <div class="form-group">
            <label for="first_name">Primer Nombre</label>
            <input type="text" class="form-control" id="first_name" name="first_name" value="{{ formulario.instance.first_name }}" required>
        </div>
        <div class="form-group">
            <label for="last_name">Apellido</label>
            <input type="text" class="form-control" id="last_name" name="last_name" value="{{ formulario.instance.last_name }}" required>
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ formulario.instance.email }}" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Guardar cambios</button>
    </form>

    <!-- Botón para regresar al menú principal -->
    <div class="text-center mt-4">
        <a href="{% url 'inicio' %}" class="btn btn-secondary">Regresar al Menú Principal</a>
    </div>
</div>
{% endblock %}
