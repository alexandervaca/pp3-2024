{% load static %}
<!doctype html>
<html lang="ES">

<head>
  <!--SACAR ANTES DEL DEPLOY -->
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Last-Modified" content="0">
  <meta http-equiv="Cache-Control" content="no-cache, mustrevalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- favicon -->
  <link rel="shortcut icon" href={% static 'imagenes/favicon.ico' %} type="image/x-icon">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css.' %}">
  <!-- Fondo -->
  <link rel="stylesheet" href="{% static 'css/gradient.css.' %}">
  <link rel="stylesheet" href="{% static 'css/estilos.css.' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css'%}">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
    integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">

  {% block head %} {% endblock %}
  <title> {% block titulo %} {% endblock %} </title>
</head>

<body>
  <div id="page-top">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3" id="mainNav">
        <div class="container px-5 px-lg-5">
          <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto my-2 my-lg-0">                    
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}" style="font-size: 25px;">Inicio</a>
                    </li>
                    
                </ul>
            </div>
        </div>                         
    </nav>
</div>
  <!--IMÁGENES-->
  <!--class="img-fluid" RESPONSIVE-->
  <!--class="img-thumbnail" le agrega un marco a la imanes-->
  <!--class="img-fluid mx-auto d-block" centra la imagen-->
  <div class="container-fluid text-center text-light container-center text-center">
    <!--<img src= {% static 'imagenes/Background.jpg' %} class="img-fluid mx-auto d-block" alt="" srcset=""> -->
    {% block body %} {% endblock %}
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
  </div>
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="{% static 'bootstrap/js/bootstrap.min.js'%}"></script>
  <!--ICONOS-->
  <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/solid.js" integrity="sha384-+Ga2s7YBbhOD6nie0DzrZpJes+b2K1xkpKxTFFcx59QmVPaSA8c7pycsNaFwUK6l" crossorigin="anonymous"></script>
  <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/fontawesome.js" integrity="sha384-7ox8Q2yzO/uWircfojVuCQOZl+ZZBg2D2J5nkpLqzH1HY0C1dHlTKIbpRz/LG23c" crossorigin="anonymous"></script>
</body>

</html>
